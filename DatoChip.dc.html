<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/wigi-design-system-ef477c14-3c6e-4d00-bd78-9401c685bc3b/colors_and_type.css">
<script src="_ds/wigi-design-system-ef477c14-3c6e-4d00-bd78-9401c685bc3b/_ds_bundle.js"></script>
</helmet>
<span style="position:relative;display:inline-flex;vertical-align:middle;line-height:1">
<button type="button" aria-label="{{ aria }}" onClick="{{ toggle }}" onMouseEnter="{{ show }}" onMouseLeave="{{ hide }}" onFocus="{{ show }}" onBlur="{{ hide }}" style="all:unset;cursor:help;display:inline-flex;border-radius:999px" style-focus="outline:2px solid #0031EC;outline-offset:2px">
<sc-if value="{{ isPublico }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#F5F5F5;color:#0A0A0A;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.02em;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#0A0A0A"></span>Dato público</span></sc-if>
<sc-if value="{{ isEstimacion }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#E8ECFD;color:#001D9B;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.02em;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#0031EC"></span>Estimación Wigilabs</span></sc-if>
<sc-if value="{{ isConfirmar }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px dashed #666666;color:#525252;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.02em;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;border:1px solid #666666;box-sizing:border-box"></span>Dato por confirmar</span></sc-if>
<sc-if value="{{ isXiid }}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid #0A0A0A;color:#0A0A0A;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.02em;white-space:nowrap">según Xiid</span></sc-if>
</button>
<sc-if value="{{ open }}">
<span role="tooltip" style="position:absolute;bottom:calc(100% + 8px);left:0;z-index:40;width:260px;max-width:70vw;background:#0A0A0A;color:#FAFAFA;padding:10px 12px;border-radius:8px;font:400 12.5px/1.45 Inter,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left;white-space:normal">
<span style="display:block;font:600 10px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A3A3A3;margin-bottom:6px">{{ label }}</span>{{ fuente }}</span>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:120},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;publico&quot;,&quot;estimacion&quot;,&quot;confirmar&quot;,&quot;xiid&quot;],&quot;default&quot;:&quot;publico&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fuente&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;El CEO, 2024&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const t = this.props.tipo || 'publico';
    const labels = { publico: 'Fuente', estimacion: 'Supuesto', confirmar: 'Dato interno de Álica', xiid: 'Afirmación del fabricante' };
    const names = { publico: 'Dato público', estimacion: 'Estimación Wigilabs', confirmar: 'Dato por confirmar', xiid: 'según Xiid' };
    return {
      isPublico: t === 'publico', isEstimacion: t === 'estimacion', isConfirmar: t === 'confirmar', isXiid: t === 'xiid',
      open: this.state.open, label: labels[t], aria: names[t] + ': ' + (this.props.fuente || ''),
      fuente: this.props.fuente || '',
      show: () => this.setState({ open: true }),
      hide: () => this.setState({ open: false }),
      toggle: (e) => { e.stopPropagation(); this.setState(s => ({ open: !s.open })); }
    };
  }
}
</script>
</body>
</html>
